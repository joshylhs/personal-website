<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Portfolio</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cloudflare.com">
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    /* Ensures the background fills the entire screen perfectly */
    #vanta-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1; /* Puts the animation safely behind your future content */
    }
  </style>
</head>
<body>
  <!-- Single Toggle Button (Stays visible) -->
<button id="drawer-toggle" aria-expanded="false" aria-controls="pullout-drawer">
  Menu
</button>

<!-- Pullout Modal (Drawer) -->
<dialog id="pullout-drawer" class="drawer">
  <div class="drawer-content">
    <h2>Navigation</h2>
    <ul>
      <li><a href="#home">Home</a></li>
      <li><a href="#services">Services</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </div>
</dialog>

  <!-- The target background container -->
  <div id="vanta-bg"></div>

  <!-- Loaded stable CDN links instead of local files -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.fog.min.js"></script>
  <script>
    VANTA.FOG({
      el: "#vanta-bg",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00
    })
  </script>
  <script src="./script.js"></script>

</body>
</html>
